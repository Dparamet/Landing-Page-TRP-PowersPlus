events {}

http {
    upstream frontend {
        server host.docker.internal:3000;
    }
    server {
        listen 80;

        root /usr/share/nginx/html;

        index index.html;

        location /admin {
            return 301 /admin/login;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}